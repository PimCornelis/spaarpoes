          <path class="hat-stripe" d="M89 27Q100 23 109 26M94 17Q99 15.5 104 17"/>
          <circle class="pompom outline" cx="99" cy="8" r="6.5"/>
        </g>
      </g>
    </g>

    <path class="collar-edge" d="M71 118Q100 135 129 118"/>
    <path class="collar" d="M71 118Q100 135 129 118"/>
    <circle class="tag outline" cx="100" cy="135" r="9.5"/>
    <path class="tag-heart" d="M100 140.5C96 138 93.8 135.6 94.4 133.2C95 130.8 98.4 130.4 100 133C101.6 130.4 105 130.8 105.6 133.2C106.2 135.6 104 138 100 140.5Z"/>

    <g class="show-party">
      <path class="fur outline" d="M70 142C50 140 34 124 34 108C34 97 49 95 53 105C56 116 66 125 78 128Z"/>
      <path class="fur outline" d="M130 142C150 140 166 124 166 108C166 97 151 95 147 105C144 116 134 125 122 128Z"/>
      <ellipse class="inner-ear" cx="43" cy="107" rx="4.5" ry="5.5"/>
      <ellipse class="inner-ear" cx="157" cy="107" rx="4.5" ry="5.5"/>
    </g>
  </g>

  <g class="show-sleepy">
    <path class="zzz z1" d="M154 52h10l-10 11h10"/>
    <path class="zzz z2" d="M167 31h13l-13 14h13"/>
    <path class="zzz z3" d="M180 6h15l-15 17h15"/>
  </g>
  <path class="drop outline show-worried" d="M165 52C165 52 156 64 156 70C156 75 160 78 165 78S174 75 174 70C174 64 165 52 165 52Z"/>
  <g class="show-party">
    <path class="sparkle s1" d="M24 38Q27 50 37 53Q27 56 24 68Q21 56 11 53Q21 50 24 38Z"/>
    <path class="sparkle s2" d="M174 54Q176 62 183 64Q176 66 174 74Q172 66 165 64Q172 62 174 54Z"/>
    <path class="sparkle s3" d="M22 128Q24 135 30 137Q24 139 22 146Q20 139 14 137Q20 135 22 128Z"/>
    <path class="sparkle s4" d="M182 106Q184 113 190 115Q184 117 182 124Q180 117 174 115Q180 113 182 106Z"/>
  </g>
</svg>
