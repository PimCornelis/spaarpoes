/* Colours, poses and movement of the kitten, and the confetti. Colour values come from js/theme.js.
   Poses (how the head and ears are held) are separate from movement, so that with "less motion" the
   kitten still changes pose, but nothing moves. */

.kitten {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

/* --- which parts show in which mood --- */

.kitten [class*='show-'] {
  display: none;
}

.kitten[data-state='content'] .show-content,
.kitten[data-state='party'] .show-party,
.kitten[data-state='sleepy'] .show-sleepy,
.kitten[data-state='worried'] .show-worried {
  display: inline;
}

/* --- colours --- */

.kitten .outline {
  stroke: var(--color-outline);
  stroke-width: 2.8;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.kitten .no-fill {
  fill: none;
}

.kitten .fur { fill: var(--color-fur); }
.kitten .shade { fill: var(--color-fur-shade); }
.kitten .light { fill: var(--color-fur-light); }
.kitten .inner-ear { fill: var(--color-inner-ear); }
.kitten .nose { fill: var(--color-nose); }
.kitten .cheek { fill: var(--color-cheek); opacity: 0.55; }
.kitten .eye { fill: var(--color-outline); }
.kitten .glint { fill: var(--color-surface); }
.kitten .mouth { fill: var(--color-outline); }
.kitten .tongue { fill: var(--color-nose); }

.kitten .line,
.kitten .detail {
  fill: none;
  stroke: var(--color-outline);
  stroke-width: 3.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.kitten .line.thin { stroke-width: 2.6; }
.kitten .detail { stroke-width: 1.8; }

.kitten .cushion {
  fill: var(--color-cushion);
}

.kitten .cushion-seam {
  fill: none;
  stroke: var(--color-surface);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 5 6;
}

.kitten .tail-edge,
.kitten .tail-fur,
.kitten .tail-tip {
  fill: none;
  stroke-linecap: round;
}

.kitten .tail-edge { stroke: var(--color-outline); stroke-width: 19; }
.kitten .tail-fur { stroke: var(--color-fur-shade); stroke-width: 13.6; }
.kitten .tail-tip { stroke: var(--color-fur-light); stroke-width: 13.6; }

.kitten .collar-edge,
.kitten .collar {
  fill: none;
  stroke-linecap: round;
}

.kitten .collar-edge { stroke: var(--color-outline); stroke-width: 11; }
.kitten .collar { stroke: var(--color-collar); stroke-width: 6.5; }
.kitten .tag { fill: var(--color-bell); }
.kitten .tag-heart { fill: var(--color-nose); }

.kitten .hat { fill: var(--color-collar); }
.kitten .hat-stripe { fill: none; stroke: var(--color-bell); stroke-width: 4; stroke-linecap: round; }
.kitten .pompom { fill: var(--color-confetti1); }
.kitten .sparkle { fill: var(--color-bell); }
.kitten .drop { fill: var(--color-tear); }

.kitten .zzz {
  fill: none;
  stroke: var(--color-collar);
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* --- poses --- */

.kitten .head-pose { transform-origin: 100px 118px; }
.kitten .ear-left { transform-origin: 74px 54px; }
.kitten .ear-right { transform-origin: 126px 54px; }

.kitten[data-state='sleepy'] .head-pose { transform: translateY(6px) rotate(7deg); }
.kitten[data-state='sleepy'] .ear-left { transform: rotate(-8deg); }
.kitten[data-state='sleepy'] .ear-right { transform: rotate(8deg); }

.kitten[data-state='worried'] .head-pose { transform: translateY(2px) rotate(-5deg); }
.kitten[data-state='worried'] .ear-left { transform: rotate(-17deg); }
.kitten[data-state='worried'] .ear-right { transform: rotate(17deg); }

/* --- movement --- */

.kitten .tail { transform-origin: 136px 166px; }
.kitten .head-move { transform-origin: 100px 118px; }
.kitten .eyes-open { transform-origin: 100px 82px; animation: kitten-blink 5s infinite; }
.kitten .sparkle { transform-box: fill-box; transform-origin: center; }

.kitten[data-state='content'] .tail { animation: kitten-tail 3.6s ease-in-out infinite; }
.kitten[data-state='party'] .cat { animation: kitten-hop 0.7s ease-in-out infinite; }
.kitten[data-state='party'] .tail { animation: kitten-tail 0.7s ease-in-out infinite; }
.kitten[data-state='party'] .sparkle { animation: kitten-twinkle 1.1s ease-in-out infinite; }
.kitten .s2 { animation-delay: 0.25s; }
.kitten .s3 { animation-delay: 0.5s; }
.kitten .s4 { animation-delay: 0.75s; }
.kitten[data-state='sleepy'] .head-move { animation: kitten-breathe 4.2s ease-in-out infinite; }
.kitten[data-state='sleepy'] .zzz { animation: kitten-snooze 3.6s ease-in-out infinite; }
.kitten .z2 { animation-delay: 0.6s; }
.kitten .z3 { animation-delay: 1.2s; }
.kitten[data-state='worried'] .head-move { animation: kitten-fret 3.4s ease-in-out infinite; }
.kitten[data-state='worried'] .drop { animation: kitten-drip 2.4s ease-in-out infinite; }

@keyframes kitten-blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.12); }
}

@keyframes kitten-tail {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}

@keyframes kitten-hop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes kitten-twinkle {
  0%, 100% { transform: scale(0.55); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
}

@keyframes kitten-breathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(2.5px); }
}

@keyframes kitten-snooze {
  0%, 100% { opacity: 0.25; transform: translateY(3px); }
  50% { opacity: 1; transform: translateY(-3px); }
}

@keyframes kitten-fret {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2.5deg); }
}

@keyframes kitten-drip {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

/* --- confetti --- */

.confetti {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.confetti i {
  position: absolute;
  top: -5%;
  left: var(--x);
  width: 0.55rem;
  height: 0.85rem;
  border-radius: 0.15rem;
  background: var(--paper);
  animation: confetti-fall var(--time) linear var(--delay) infinite;
}

.confetti i:nth-child(3n) {
  width: 0.6rem;
  height: 0.6rem;
  border-radius: 50%;
}

@keyframes confetti-fall {
  0% { top: -5%; transform: rotate(0deg) translateX(0); }
  100% { top: 105%; transform: rotate(var(--spin)) translateX(var(--drift)); }
}

/* --- less motion: the phone's setting, or the app's own switch --- */

@media (prefers-reduced-motion: reduce) {
  .kitten,
  .kitten *,
  .confetti i {
    animation: none !important;
    transition: none !important;
  }

  /* The paper lies still, spread over the top of the card. */
  .confetti i {
    top: var(--rest);
    transform: rotate(var(--spin));
  }
}

.reduce-motion .kitten,
.reduce-motion .kitten *,
.reduce-motion .confetti i {
  animation: none !important;
  transition: none !important;
}

.reduce-motion .confetti i {
  top: var(--rest);
  transform: rotate(var(--spin));
}

.preview { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
.moods { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.moods figure { margin: 0; text-align: center; }
.moods .big { width: 14rem; max-width: 100%; margin: 0 auto; }
.small-row { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; justify-content: center; }
